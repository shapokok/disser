services:
  app:
    build: .
    image: crop-disease
    container_name: crop-disease
    ports:
      - "5001:5001"
    volumes:
      - ./models:/app/models          # trained weights (+ field model) live outside the image
      - ./results:/app/results        # evaluation files shown on the statistics page
      - ./data/uploads:/app/data/uploads
      - ./domain_adaptation_experiments/results:/app/domain_adaptation_experiments/results:ro
    environment:
      CROP_DEVICE: cpu
      CROP_LIME_SAMPLES: "300"
    restart: unless-stopped
