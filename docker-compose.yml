version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crop-disease-backend
    ports:
      - "5000:5000"
    volumes:
      # Persist uploaded images
      - ./data/uploads:/app/data/uploads
      # Persist models (if you have trained models)
      - ./models:/app/models
      # Persist results
      - ./results:/app/results
      # Mount frontend for serving
      - ./frontend:/app/frontend
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - crop-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: crop-disease-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crop-network
    profiles:
      - production

networks:
  crop-network:
    driver: bridge

volumes:
  uploads:
  models:
  results:
