<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика моделей — CropAI Monitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e7a46'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stats">
  <header class="site-header">
    <div class="container navbar">
      <a href="/" class="brand"><span class="brand-mark" data-icon="leaf"></span><span data-i18n="app.name">CropAI Monitor</span></a>
      <button class="icon-btn menu-toggle" id="menuToggle" data-i18n-title="nav.menu" data-icon="menu"></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/" data-page="home" data-i18n="nav.home">Главная</a></li>
        <li><a href="/analyze" data-page="analyze" data-i18n="nav.analyze">Анализ</a></li>
        <li><a href="/stats" data-page="stats" data-i18n="nav.stats">Статистика</a></li>
      </ul>
      <div class="nav-tools">
        <div class="lang-switch" role="group" aria-label="Language"><button data-lang="ru" aria-pressed="true">RU</button><button data-lang="en" aria-pressed="false">EN</button></div>
        <button class="icon-btn" id="themeToggle" data-i18n-title="nav.theme"></button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head"><div><h1 style="font-size:1.8rem" data-i18n="stats.title"></h1><p data-i18n="stats.sub"></p></div><div id="evalInfo" class="small muted"></div></div>

      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="overview" aria-selected="true" data-i18n="stats.tab_overview"></button>
        <button role="tab" data-tab="training" aria-selected="false" data-i18n="stats.tab_training"></button>
        <button role="tab" data-tab="classes" aria-selected="false" data-i18n="stats.tab_classes"></button>
        <button role="tab" data-tab="confusion" aria-selected="false" data-i18n="stats.tab_confusion"></button>
        <button role="tab" data-tab="research" aria-selected="false" data-i18n="stats.tab_research"></button>
      </div>

      <section class="tab-panel stack" id="tab-overview">
        <div class="grid grid-4" id="overviewTiles"></div>
        <div class="card"><div class="card-head"><h3 data-i18n="home.models_title"></h3></div><div class="table-wrap" id="modelsTable"></div></div>
        <div class="grid grid-2">
          <div class="card chart-card"><div class="card-body"><p class="chart-title" data-i18n="stats.chart_acc_title"></p><p class="chart-sub" data-i18n="stats.chart_acc_sub"></p><div class="chart-box short"><canvas id="accChart"></canvas></div></div></div>
          <div class="card chart-card"><div class="card-body"><p class="chart-title" data-i18n="stats.chart_time_title"></p><p class="chart-sub" data-i18n="stats.chart_time_sub"></p><div class="chart-box short"><canvas id="timeChart"></canvas></div></div></div>
        </div>
      </section>

      <section class="tab-panel stack" id="tab-training" hidden>
        <div class="grid grid-2">
          <div class="card chart-card"><div class="card-body"><p class="chart-title" data-i18n="stats.chart_curves_title"></p><p class="chart-sub" data-i18n="stats.chart_curves_sub"></p><div class="chart-box"><canvas id="curvesChart"></canvas></div></div></div>
          <div class="card chart-card"><div class="card-body"><p class="chart-title" data-i18n="stats.chart_loss_title"></p><p class="chart-sub" data-i18n="stats.chart_loss_sub"></p><div class="chart-box"><canvas id="lossChart"></canvas></div></div></div>
        </div>
        <div class="card"><div class="card-head"><h3 data-i18n="stats.training_config"></h3></div><div class="table-wrap" id="trainingTable"></div></div>
      </section>

      <section class="tab-panel stack" id="tab-classes" hidden>
        <div class="card">
          <div class="card-head">
            <h3 data-i18n="stats.per_class_title"></h3>
            <div class="row">
              <select class="select" id="classModelSelect" style="width:auto"></select>
              <input class="input" id="classSearch" style="width:220px" data-i18n-placeholder="stats.search">
            </div>
          </div>
          <div class="card-body" id="classHighlights"></div>
          <div class="table-wrap" id="classTable"></div>
        </div>
      </section>

      <section class="tab-panel stack" id="tab-confusion" hidden>
        <div class="card">
          <div class="card-head">
            <div><h3 data-i18n="stats.confusion_title"></h3><p class="small muted" style="margin:0" data-i18n="stats.confusion_sub"></p></div>
            <div class="row">
              <select class="select" id="cmModelSelect" style="width:auto"></select>
              <label class="small row" style="gap:.35rem"><input type="checkbox" id="cmHideDiag"> <span id="cmHideDiagLabel"></span></label>
            </div>
          </div>
          <div class="card-body"><div class="cm-wrap" id="cmGrid"></div></div>
        </div>
        <div class="card"><div class="card-head"><h3 data-i18n="stats.confused_pairs"></h3></div><div class="table-wrap" id="cmPairs"></div></div>
      </section>

      <section class="tab-panel stack" id="tab-research" hidden>
        <div class="card"><div class="card-body prose">
          <h2 data-i18n="stats.research_title"></h2>
          <p class="muted" data-i18n="stats.research_sub"></p>
          <p class="small" data-i18n="stats.protocol_text"></p>
          <div id="researchMeta" class="row small muted"></div>
        </div></div>
        <div id="researchBody" class="stack"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer"><div class="container row"><span data-i18n="app.tagline"></span></div></footer>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
