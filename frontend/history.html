<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Журнал анализов — CropAI Monitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231b7a45'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="history">
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="/" class="brand"><span class="brand-mark" data-icon="leaf"></span><span data-i18n="app.name">CropAI Monitor</span></a>
        <button class="icon-btn menu-toggle" id="menuToggle" data-i18n-title="nav.menu" data-icon="menu"></button>
        <ul class="nav-links" id="navLinks">
          <li><a href="/" data-page="home" data-i18n="nav.home">Главная</a></li>
          <li><a href="/analyze" data-page="analyze" data-i18n="nav.analyze">Анализ</a></li>
          <li><a href="/history" data-page="history" data-i18n="nav.history">Журнал</a></li>
          <li><a href="/stats" data-page="stats" data-i18n="nav.stats">Статистика</a></li>
        </ul>
        <div class="nav-tools">
          <div class="lang-switch" role="group" aria-label="Language"><button data-lang="ru" aria-pressed="true">RU</button><button data-lang="en" aria-pressed="false">EN</button></div>
          <button class="icon-btn" id="themeToggle" data-i18n-title="nav.theme"></button>
        </div>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container stack">
      <div class="page-title row between">
        <div><span class="eyebrow" data-i18n="nav.history"></span><h1 data-i18n="history.title"></h1><p data-i18n="history.sub"></p></div>
        <button class="btn sm" id="clearHistory" data-i18n="history.clear"></button>
      </div>

      <div class="grid grid-4" id="historyTiles"></div>

      <div class="grid grid-2">
        <div class="card chart-card"><div class="card-body"><p class="chart-title" data-i18n="history.chart_days"></p><p class="chart-sub" data-i18n="history.chart_days_sub"></p><div class="chart-box short"><canvas id="daysChart"></canvas></div></div></div>
        <div class="card chart-card"><div class="card-body"><p class="chart-title" data-i18n="history.chart_classes"></p><p class="chart-sub" data-i18n="history.chart_classes_sub"></p><div class="chart-box short"><canvas id="classesChart"></canvas></div></div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3 data-i18n="history.records"></h3>
          <div class="row">
            <select class="select" id="filterModel" style="width:auto"></select>
            <select class="select" id="filterPlant" style="width:auto"></select>
            <select class="select" id="filterHealth" style="width:auto"></select>
            <input class="input" id="filterQuery" style="width:200px" data-i18n-placeholder="history.search">
          </div>
        </div>
        <div class="table-wrap" id="historyTable"></div>
        <div class="result-footer" id="historyPager"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container row"><span data-i18n="app.tagline"></span></div></footer>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
