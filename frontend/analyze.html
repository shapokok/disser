<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализ изображений — CropAI Monitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e7a46'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="analyze">
  <header class="site-header">
    <div class="container navbar">
      <a href="/" class="brand"><span class="brand-mark" data-icon="leaf"></span><span data-i18n="app.name">CropAI Monitor</span></a>
      <button class="icon-btn menu-toggle" id="menuToggle" data-i18n-title="nav.menu" data-icon="menu"></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/" data-page="home" data-i18n="nav.home">Главная</a></li>
        <li><a href="/analyze" data-page="analyze" data-i18n="nav.analyze">Анализ</a></li>
        <li><a href="/stats" data-page="stats" data-i18n="nav.stats">Статистика</a></li>
      </ul>
      <div class="nav-tools">
        <div class="lang-switch" role="group" aria-label="Language"><button data-lang="ru" aria-pressed="true">RU</button><button data-lang="en" aria-pressed="false">EN</button></div>
        <button class="icon-btn" id="themeToggle" data-i18n-title="nav.theme"></button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head"><div><h1 style="font-size:1.8rem" data-i18n="analyze.title"></h1><p data-i18n="analyze.sub"></p></div></div>

      <div class="analyze-layout">
        <aside class="stack sticky">
          <div class="card">
            <div class="card-head"><h3 data-i18n="analyze.settings"></h3></div>
            <div class="card-body stack">
              <div class="field">
                <label for="modelSelect" data-i18n="analyze.model"></label>
                <select id="modelSelect" class="select"></select>
                <div class="hint" id="modelHint"></div>
              </div>
              <div class="field">
                <label data-i18n="analyze.explanation"></label>
                <div class="segmented" id="explanationSeg" role="group">
                  <button type="button" data-value="gradcam" aria-pressed="true" data-i18n="analyze.gradcam"></button>
                  <button type="button" data-value="lime" aria-pressed="false" data-i18n="analyze.lime"></button>
                  <button type="button" data-value="none" aria-pressed="false" data-i18n="analyze.none"></button>
                </div>
                <div class="hint" data-i18n="analyze.explanation_hint"></div>
              </div>
              <div class="field">
                <label data-i18n="analyze.mode"></label>
                <div class="segmented" id="modeSeg" role="group">
                  <button type="button" data-value="controlled" aria-pressed="true" data-i18n="analyze.mode_controlled"></button>
                  <button type="button" data-value="field" aria-pressed="false" data-i18n="analyze.mode_field"></button>
                </div>
                <div class="hint" id="modeHint"></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <div class="dropzone" id="dropzone" tabindex="0" role="button">
                <div class="icon" data-icon="upload"></div>
                <strong data-i18n="analyze.drop_title"></strong>
                <span data-i18n="analyze.drop_sub"></span>
                <input type="file" id="fileInput" class="visually-hidden" accept="image/*,.jfif" multiple>
              </div>
              <div class="previews" id="previews"></div>
              <div class="row" style="margin-top:1rem">
                <button class="btn primary grow" id="analyzeBtn" disabled><span data-i18n="analyze.run"></span></button>
                <button class="btn" id="compareBtn" disabled data-i18n="analyze.compare"></button>
                <button class="btn ghost sm" id="clearBtn" data-i18n="analyze.clear"></button>
              </div>
            </div>
          </div>
        </aside>

        <section class="stack" id="results">
          <div class="card empty" id="emptyState">
            <div data-icon="image"></div>
            <h3 data-i18n="analyze.empty_title"></h3>
            <p data-i18n="analyze.empty_sub"></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container row"><span data-i18n="app.tagline"></span></div></footer>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/analyze.js"></script>
</body>
</html>
