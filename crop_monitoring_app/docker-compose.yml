version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crop-disease-backend
    ports:
      - "5000:5000"
    volumes:
      # Mount directories for development
      - ./data/uploads:/app/data/uploads
      - ./data/sample_images:/app/data/sample_images
      - ./data/field_images:/app/data/field_images
      - ./results:/app/results
      - ./models:/app/models
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=5000
    restart: unless-stopped
    networks:
      - crop-disease-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend web server (nginx)
  frontend:
    image: nginx:alpine
    container_name: crop-disease-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crop-disease-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  crop-disease-network:
    driver: bridge

volumes:
  models-data:
  uploads-data:
  results-data:
