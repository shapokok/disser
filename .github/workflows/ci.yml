name: CI

on:
  push:
    branches: [main, master, clean-main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Lint & unit/API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check backend scripts tests domain_adaptation_experiments/da
      - name: Pytest (no model weights in CI)
        run: uv run pytest -m "not models"

  e2e:
    name: Playwright (frontend against the API without weights)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: uv sync
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npx playwright test --project=chromium
        env:
          CI: "1"
          PYTHON: uv run python
          CROP_MODELS: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
